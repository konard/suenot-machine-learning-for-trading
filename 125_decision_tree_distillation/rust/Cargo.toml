[package]
name = "decision_tree_distillation"
version = "0.1.0"
edition = "2021"
description = "Decision Tree Distillation for Trading - Extract interpretable rules from complex models"
license = "MIT"
authors = ["ML Trading Team"]
keywords = ["machine-learning", "trading", "distillation", "decision-tree", "interpretability"]
categories = ["science", "algorithms"]

[[example]]
name = "basic_distillation"
path = "examples/basic_distillation.rs"

[[example]]
name = "trading_strategy"
path = "examples/trading_strategy.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ndarray = "0.15"
ndarray-stats = "0.5"
statrs = "0.16"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
rand = "0.8"
rand_distr = "0.4"

[dev-dependencies]
tokio-test = "0.4"
approx = "0.5"
