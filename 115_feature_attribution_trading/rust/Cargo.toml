[package]
name = "feature_attribution_trading"
version = "0.1.0"
edition = "2021"
authors = ["ML4T Contributors"]
description = "Feature Attribution Methods for Trading Signal Explanation"
license = "MIT"
readme = "README.md"
keywords = ["trading", "explainability", "feature-attribution", "machine-learning", "finance"]
categories = ["science", "algorithms"]

[dependencies]
# Numerical computing
ndarray = { version = "0.16", features = ["rayon"] }
ndarray-rand = "0.15"
rand = "0.8"
rand_distr = "0.4"

# Parallel computing
rayon = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
criterion = "0.5"
approx = "0.5"
tokio-test = "0.4"

[[bench]]
name = "attribution_benchmark"
harness = false

[[example]]
name = "basic_attribution"

[[example]]
name = "trading_strategy"

[features]
default = []
