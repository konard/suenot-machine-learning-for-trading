[package]
name = "counterfactual_trading"
version = "0.1.0"
edition = "2021"
description = "Counterfactual analysis for trading decisions"
license = "MIT"

[dependencies]
ndarray = "0.15"
ndarray-stats = "0.5"
statrs = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
criterion = "0.5"

[[example]]
name = "counterfactual_demo"
path = "examples/counterfactual_demo.rs"
