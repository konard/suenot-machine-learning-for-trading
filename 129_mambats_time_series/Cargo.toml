[package]
name = "mambats_time_series"
version = "0.1.0"
edition = "2021"
description = "MambaTS: Improved Selective State Space Models for Long-term Time Series Forecasting"
authors = ["ML Trading Examples"]
license = "MIT"
readme = "README.md"

[lib]
name = "mambats_time_series"
path = "src/lib.rs"

[[example]]
name = "fetch_data"
path = "examples/fetch_data.rs"

[[example]]
name = "predict"
path = "examples/predict.rs"

[[example]]
name = "backtest"
path = "examples/backtest.rs"

[[example]]
name = "train_model"
path = "examples/train_model.rs"

[dependencies]
# HTTP client for API requests
reqwest = { version = "0.11", features = ["json"] }

# JSON serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Numerical computation
ndarray = { version = "0.15", features = ["serde"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# CSV for data export/import
csv = "1.3"

# Random number generation
rand = "0.8"
rand_distr = "0.4"

# Progress bars
indicatif = "0.17"

[dev-dependencies]
approx = "0.5"
tokio-test = "0.4"
